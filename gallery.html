<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kedai Kopi Nusantara | Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Navigasi utama">
      <div class="container">
        <a class="navbar-brand" href="index.html">☕ Kedai Kopi Nusantara</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
          aria-controls="mainNav" aria-expanded="false" aria-label="Buka navigasi">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
            <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="page-header">
      <div class="container">
        <p class="text-uppercase mb-2">Lihat suasananya</p>
        <h1 class="display-4">Gallery</h1>
        <p class="lead mb-0">Potongan kecil dari ruang, kopi, dan aktivitas di kedai.</p>
      </div>
    </section>
    <div class="section-pad">
      <div class="container">
        <div class="row g-4">
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/interior.jpeg" alt="Interior kedai">
              <div class="popover-card">
                <h2>Interior Kedai</h2>
                <div class="popover-tags"><span class="tag">Suasana</span><span class="tag">Cozy</span>
                </div>
                <p class="popover-desc">Area duduk nyaman dengan meja kayu alami dan pencahayaan hangat
                  untuk bekerja atau bersantai.</p>
                <div class="popover-meta">
                  <p><strong>Kapasitas:</strong> 50 Orang</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/coffee-counter.jpeg" alt="Konter barista">
              <div class="popover-card">
                <h3>Coffee Counter</h3>
                <div class="popover-tags"><span class="tag">Barista</span><span class="tag">Espresso</span></div>
                <p class="popover-desc">Stasiun penyeduhan berstandar profesional tempat para barista
                  kami meracik kopi pilihan Anda.</p>
                <div class="popover-meta">
                  <p><strong>Mesin:</strong> Commercial Espresso</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/beans.jpeg" alt="Biji kopi">
              <div class="popover-card">
                <h3>Biji Kopi Pilihan</h3>
                <div class="popover-tags"><span class="tag">Single Origin</span><span class="tag">Kurasi</span></div>
                <p class="popover-desc">Koleksi biji kopi arabika dan robusta terbaik yang didatangkan
                  langsung dari petani lokal.</p>
                <div class="popover-meta">
                  <p><strong>Proses:</strong> Natural / Full Washed</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/people.jpeg" alt="Pelanggan">
              <div class="popover-card">
                <h3>Area Komunitas</h3>
                <div class="popover-tags"><span class="tag">Interaksi</span><span class="tag">Ruang</span></div>
                <p class="popover-desc">Tempat bertemunya ide, diskusi hangat, dan momen kebersamaan
                  antar penikmat kopi.</p>
                <div class="popover-meta">
                  <p><strong>Fasilitas:</strong> Wi-Fi & Power Outlet</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/menu-gayo.jpeg" alt="Kopi Gayo">
              <div class="popover-card">
                <h3>Kopi Aceh Gayo</h3>
                <div class="popover-tags"><span class="tag">Arabica</span><span class="tag">Specialty</span></div>
                <p class="popover-desc">Memiliki aroma khas dengan tingkat keasaman seimbang dan flavor
                  profile spicy-herbal.</p>
                <div class="popover-meta">
                  <p><strong>Harga:</strong> Rp 28.000</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/menu-toraja.jpeg" alt="Toraja Latte">
              <div class="popover-card">
                <h3>Toraja Latte</h3>
                <div class="popover-tags"><span class="tag">Latte Art</span><span class="tag">Milk
                    Based</span></div>
                <p class="popover-desc">Perpaduan espresso Toraja yang earthy dengan susu segar yang
                  lembut dan creamy.</p>
                <div class="popover-meta">
                  <p><strong>Harga:</strong> Rp 32.000</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/menu-kintamani.jpeg" alt="Cold Brew Kintamani">
              <div class="popover-card">
                <h3>Cold Brew Kintamani</h3>
                <div class="popover-tags"><span class="tag">Cold Brew</span><span class="tag">Fruity</span></div>
                <p class="popover-desc">Kopi seduh dingin dengan hint rasa jeruk alami khas daerah
                  Kintamani Bali yang menyegarkan.</p>
                <div class="popover-meta">
                  <p><strong>Harga:</strong> Rp 30.000</p>
                </div>
              </div>
            </figure>
          </article>
          <article class="col-6 col-xl-3">
            <figure class="gallery-card mb-0">
              <img src="assets/images/roasting.jpeg" alt="Proses Roasting">
              <div class="popover-card">
                <h3>Proses Roasting</h3>
                <div class="popover-tags"><span class="tag">Fresh Roast</span><span class="tag">Medium
                    Roast</span></div>
                <p class="popover-desc">Pengasangan biji kopi secara berkala untuk memastikan kesegaran
                  cita rasa di setiap cangkir.</p>
                <div class="popover-meta">
                  <p><strong>Jadwal:</strong> 2x Seminggu</p>
                </div>
              </div>
            </figure>
          </article>
        </div>
      </div>
    </div>
  </main>
  <footer class="py-4">
    <div class="container text-center">
      <p class="mb-1">© 2026 Kedai Kopi Nusantara</p>
      <p class="mb-0"><a href="contact.html">Temukan lokasi kami</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
